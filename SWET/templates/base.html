<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SWET — Storage Write-Endurance Tracker{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #1a1a1a; display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar { width: 220px; background: #1e1e2e; color: #cdd6f4; display: flex; flex-direction: column; padding: 1.5rem 1rem; gap: .5rem; flex-shrink: 0; }
    .sidebar .logo { font-size: 1rem; font-weight: 600; color: #cba6f7; margin-bottom: 1rem; letter-spacing: .03em; }
    .sidebar a { display: flex; align-items: center; gap: .5rem; color: #cdd6f4; text-decoration: none; padding: .5rem .75rem; border-radius: 6px; font-size: .875rem; transition: background .15s; }
    .sidebar a:hover, .sidebar a.active { background: #313244; color: #cba6f7; }
    .sidebar .alert-badge { margin-left: auto; background: #f38ba8; color: #1e1e2e; font-size: .7rem; font-weight: 700; padding: 1px 6px; border-radius: 999px; }
    .sidebar-section { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: #6c7086; margin: .75rem 0 .25rem .75rem; }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; overflow: auto; }
    .topbar { background: #fff; border-bottom: 1px solid #e5e5e5; padding: .875rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    .topbar h1 { font-size: 1.1rem; font-weight: 600; }
    .topbar .actions { display: flex; gap: .5rem; }
    .content { padding: 2rem; flex: 1; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .45rem .9rem; border-radius: 6px; font-size: .875rem; font-weight: 500; cursor: pointer; border: none; text-decoration: none; transition: opacity .15s; }
    .btn-primary { background: #7c3aed; color: #fff; }
    .btn-danger  { background: #dc2626; color: #fff; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn:hover { opacity: .88; }

    /* Cards */
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 1.25rem 1.5rem; }
    .card-title { font-size: .95rem; font-weight: 600; margin-bottom: 1rem; }

    /* Grid */
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }

    /* Health bar */
    .health-bar-wrap { background: #e5e7eb; border-radius: 999px; height: 8px; overflow: hidden; margin: .4rem 0; }
    .health-bar { height: 100%; border-radius: 999px; transition: width .4s; }
    .health-ok       { background: #22c55e; }
    .health-warn     { background: #f59e0b; }
    .health-critical { background: #ef4444; }

    /* Badges */
    .badge { display: inline-block; font-size: .7rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
    .badge-warn     { background: #fef3c7; color: #92400e; }
    .badge-critical { background: #fee2e2; color: #991b1b; }
    .badge-ok       { background: #dcfce7; color: #166534; }

    /* Table */
    table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    th { text-align: left; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: #6b7280; border-bottom: 1px solid #e5e5e5; padding: .6rem .75rem; }
    td { padding: .65rem .75rem; border-bottom: 1px solid #f3f4f6; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }

    /* Stat cards */
    .stat { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 1rem 1.25rem; }
    .stat-label { font-size: .75rem; color: #6b7280; margin-bottom: .25rem; }
    .stat-value { font-size: 1.6rem; font-weight: 600; }

    /* Form */
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: .35rem; }
    .form-group input, .form-group select { width: 100%; padding: .5rem .75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: .875rem; outline: none; transition: border-color .15s; }
    .form-group input:focus, .form-group select:focus { border-color: #7c3aed; }
    .form-max { max-width: 520px; }

    /* Alerts */
    .alert-row-warn     { border-left: 3px solid #f59e0b; }
    .alert-row-critical { border-left: 3px solid #ef4444; }

    /* Empty state */
    .empty { text-align: center; padding: 3rem 1rem; color: #9ca3af; font-size: .9rem; }
  </style>
</head>
<body>

<nav class="sidebar">
  <div class="logo">⚡ SWET</div>

  <span class="sidebar-section">Main</span>
  <a href="{% url 'dashboard' %}" {% if request.resolver_match.url_name == 'dashboard' %}class="active"{% endif %}>
    🏠 Dashboard
  </a>

  <span class="sidebar-section">Devices</span>
  <a href="{% url 'device_list' %}" {% if 'device' in request.resolver_match.url_name %}class="active"{% endif %}>
    🖥 Devices
  </a>

  <span class="sidebar-section">Monitoring</span>
  <a href="{% url 'alert_list' %}" {% if 'alert' in request.resolver_match.url_name %}class="active"{% endif %}>
    🔔 Alerts
    {% if open_alert_count %}
      <span class="alert-badge">{{ open_alert_count }}</span>
    {% endif %}
  </a>
</nav>

<div class="main">
  <div class="topbar">
    <h1>{% block page_title %}Dashboard{% endblock %}</h1>
    <div class="actions">{% block topbar_actions %}{% endblock %}</div>
  </div>
  <div class="content">
    {% block content %}{% endblock %}
  </div>
</div>

</body>
</html>
