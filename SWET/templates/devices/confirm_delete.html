{% extends 'base.html' %}
{% block page_title %}Delete device{% endblock %}

{% block content %}
<div class="card form-max">
  <div class="card-title" style="color:#dc2626;">Delete "{{ device.name }}"?</div>
  <p style="font-size:.9rem; color:#4b5563; margin-bottom:1.5rem;">
    This will also delete all SD cards and write events linked to this device. This cannot be undone.
  </p>
  <form method="post">
    {% csrf_token %}
    <div style="display:flex; gap:.75rem;">
      <button type="submit" class="btn btn-danger">Yes, delete</button>
      <a href="{% url 'device_detail' device.pk %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
