{% extends 'base.html' %}
{% block page_title %}Add device{% endblock %}

{% block content %}
<div class="card form-max">
  <div class="card-title">Add new device</div>
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Name</label>
      <input type="text" name="name" placeholder="e.g. Sensor Node A" required>
    </div>
    <div class="form-group">
      <label>Serial number</label>
      <input type="text" name="serial_number" placeholder="e.g. SN-00123" required>
    </div>
    <div class="form-group">
      <label>Location <span style="color:#9ca3af;">(optional)</span></label>
      <input type="text" name="location" placeholder="e.g. Warehouse B, Shelf 3">
    </div>

    <div style="border-top:1px solid #f3f4f6; margin:1.25rem 0; padding-top:1.25rem;">
      <div style="font-size:.85rem; font-weight:500; margin-bottom:.75rem; color:#374151;">
        📍 GPS coordinates <span style="color:#9ca3af; font-weight:400;">(enables live weather monitoring)</span>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:.75rem;">
        <div class="form-group" style="margin:0;">
          <label>Latitude</label>
          <input type="number" name="latitude" step="0.0001" min="-90" max="90"
                 placeholder="e.g. 44.4268">
          <small style="color:#6b7280; font-size:.75rem; display:block; margin-top:.2rem;">
            Bucharest: 44.4268
          </small>
        </div>
        <div class="form-group" style="margin:0;">
          <label>Longitude</label>
          <input type="number" name="longitude" step="0.0001" min="-180" max="180"
                 placeholder="e.g. 26.1025">
          <small style="color:#6b7280; font-size:.75rem; display:block; margin-top:.2rem;">
            Bucharest: 26.1025
          </small>
        </div>
      </div>
    </div>

    <div style="display:flex; gap:.75rem; margin-top:1.5rem;">
      <button type="submit" class="btn btn-primary">Save device</button>
      <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
